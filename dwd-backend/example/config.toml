# dwd-backend configuration
# Run: DWD_BACKEND_CONFIG=example/config.toml cargo run

# Global listen address for all protocols ("::" — all IPv6/IPv4, "0.0.0.0" — IPv4)
address = "::"

[http]
port = 8080

# HTTPS is enabled by default. If cert and key are not set,
# a temporary in-memory certificate is generated.
# Disable with: enabled = false
[https]
# enabled = false
port = 8443
# cert = "example/certs/cert.pem"
# key = "example/certs/key.pem"

# HTTP/3 is enabled by default and does not require [https]
# (reuses the [https] certificate or generates its own).
# Disable with: enabled = false
[http3]
# enabled = false
port = 8443
# cert = "example/certs/cert.pem"
# key = "example/certs/key.pem"

# Content to serve
[content]
file = "example/content"
payload = "hello from dwd-backend"
