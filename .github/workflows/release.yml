name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild (for example, v0.8.2)
        required: true
        type: string
      source_ref:
        description: Full immutable 40-hex commit SHA to build
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.resolve.outputs.release-tag }}
      source-sha: ${{ steps.resolve.outputs.source-sha }}
      package-version: ${{ steps.resolve.outputs.package-version }}
    steps:
      - name: Validate and resolve release inputs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            release_tag="$INPUT_RELEASE_TAG"
            source_ref="$INPUT_SOURCE_REF"
            version_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
            if [[ ! "$release_tag" =~ $version_pattern ]]; then
              echo 'release_tag must be a v-prefixed version, for example v0.8.2' >&2
              exit 1
            fi
            if [[ ! "$source_ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo 'source_ref must be a full 40-hex commit SHA' >&2
              exit 1
            fi
            # Manual rebuilds may update an existing release, never create one.
            gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          else
            release_tag="$GITHUB_REF_NAME"
            source_ref="$GITHUB_SHA"
          fi

          # Require an existing tag and resolve the source to a repository commit.
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq .ref)
          if [[ "$tag_ref" != "refs/tags/$release_tag" ]]; then
            echo 'Target tag did not resolve to the requested tag' >&2
            exit 1
          fi
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_ref" --jq .sha)
          if [[ "$source_sha" != "${source_ref,,}" ]]; then
            echo 'Source commit did not resolve to the requested SHA' >&2
            exit 1
          fi
          printf 'release-tag=%s\nsource-sha=%s\npackage-version=%s\n' \
            "$release_tag" "$source_sha" "${release_tag#v}" >> "$GITHUB_OUTPUT"

  # Build release binary without DPDK.
  build-binary:
    name: Build Binary (Ubuntu ${{ matrix.ubuntu }} ${{ matrix.codename }}, no DPDK)
    runs-on: ubuntu-${{ matrix.ubuntu }}
    needs: metadata
    strategy:
      matrix:
        include:
          - ubuntu: '24.04'
            codename: noble
          - ubuntu: '22.04'
            codename: jammy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source-sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: dwd-${{ matrix.codename }}
      - name: Build release
        run: cargo build -p dwd --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: dwd-linux-x86_64-${{ matrix.codename }}
          path: target/release/dwd
          if-no-files-found: error

  # Build DPDK-enabled binaries and debian packages for Noble and Jammy.
  build-dpdk:
    name: Build with DPDK (Ubuntu ${{ matrix.ubuntu }} ${{ matrix.codename }})
    runs-on: ubuntu-latest
    needs: metadata
    env:
      DWD_VERSION: ${{ needs.metadata.outputs.package-version }}
    strategy:
      matrix:
        include:
          - ubuntu: '24.04'
            codename: noble
          - ubuntu: '22.04'
            codename: jammy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source-sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with DPDK
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: dwd:release-build-${{ matrix.codename }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            DWD_VERSION=${{ env.DWD_VERSION }}
          load: true
          cache-from: type=gha,scope=dpdk-${{ matrix.codename }}
          cache-to: type=gha,mode=max,scope=dpdk-${{ matrix.codename }}

      - name: Extract artifacts from Docker image
        run: |
          # Create container from image.
          CONTAINER_ID=$(docker create dwd:release-build-${{ matrix.codename }})
          
          # Create output directory.
          mkdir -p dist
          
          # Copy binary and debian packages from container.
          docker cp "$CONTAINER_ID:/src/target/release/dwd" dist/dwd-dpdk
          docker cp "$CONTAINER_ID:/src/target/debian/." dist/
          
          # Cleanup.
          docker rm "$CONTAINER_ID"
          
          # List artifacts.
          ls -la dist/

      - name: Upload DPDK binary
        uses: actions/upload-artifact@v4
        with:
          name: dwd-dpdk-linux-x86_64-${{ matrix.codename }}
          path: dist/dwd-dpdk
          if-no-files-found: error

      - name: Upload debian package
        uses: actions/upload-artifact@v4
        with:
          name: dwd-debian-package-${{ matrix.codename }}
          path: dist/*.deb
          if-no-files-found: error

  # Build DPDK-enabled binary for Ubuntu 18.04 Bionic (GLIBC 2.27).
  build-dpdk-bionic:
    name: Build with DPDK (Ubuntu 18.04 Bionic)
    runs-on: ubuntu-latest
    needs: metadata
    env:
      DWD_VERSION: ${{ needs.metadata.outputs.package-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source-sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with DPDK (Ubuntu 18.04)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ubuntu18
          push: false
          tags: dwd:release-build-bionic
          build-args: DWD_VERSION=${{ env.DWD_VERSION }}
          load: true
          cache-from: type=gha,scope=ubuntu18
          cache-to: type=gha,mode=max,scope=ubuntu18

      - name: Extract artifacts from Docker image
        run: |
          # Create container from image.
          CONTAINER_ID=$(docker create dwd:release-build-bionic)
          
          # Create output directory.
          mkdir -p dist
          
          # Copy binary from container.
          docker cp "$CONTAINER_ID:/src/target/release/dwd" dist/dwd-dpdk-bionic
          
          # Copy bundled debian package (with rdma-core libs) from /src/dist/.
          docker cp "$CONTAINER_ID:/src/dist/." dist/
          
          # Cleanup.
          docker rm "$CONTAINER_ID"
          
          # List artifacts.
          ls -la dist/

      - name: Upload DPDK binary (Bionic)
        uses: actions/upload-artifact@v4
        with:
          name: dwd-dpdk-linux-x86_64-bionic
          path: dist/dwd-dpdk-bionic
          if-no-files-found: error

      - name: Upload debian package (Bionic)
        uses: actions/upload-artifact@v4
        with:
          name: dwd-debian-package-bionic
          path: dist/*.deb
          if-no-files-found: error

  build-backend:
    name: Build Backend
    needs: metadata
    uses: ./.github/workflows/backend.yml
    with:
      release-tag: ${{ needs.metadata.outputs.release-tag }}
      source-ref: ${{ needs.metadata.outputs.source-sha }}

  # Create GitHub release with all artifacts.
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [metadata, build-binary, build-dpdk, build-dpdk-bionic, build-backend]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.source-sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dwd-*

      - name: Prepare release files
        run: |
          mkdir -p release
          
          # Regular binaries (no DPDK).
          cp artifacts/dwd-linux-x86_64-noble/dwd release/dwd-linux-x86_64-noble
          cp artifacts/dwd-linux-x86_64-jammy/dwd release/dwd-linux-x86_64-jammy
          
          # DPDK binary (Ubuntu 24.04 Noble, GLIBC 2.39).
          cp artifacts/dwd-dpdk-linux-x86_64-noble/dwd-dpdk release/dwd-dpdk-linux-x86_64-noble

          # DPDK binary (Ubuntu 22.04 Jammy, GLIBC 2.35).
          cp artifacts/dwd-dpdk-linux-x86_64-jammy/dwd-dpdk release/dwd-dpdk-linux-x86_64-jammy
          
          # DPDK binary (Ubuntu 18.04 Bionic, GLIBC 2.27).
          cp artifacts/dwd-dpdk-linux-x86_64-bionic/dwd-dpdk-bionic release/dwd-dpdk-linux-x86_64-bionic
          
          cp artifacts/dwd-backend-linux-x86_64-noble/dwd-backend release/dwd-backend-linux-x86_64-noble
          cp artifacts/dwd-backend-linux-x86_64-jammy/dwd-backend release/dwd-backend-linux-x86_64-jammy
          cp artifacts/dwd-backend-linux-x86_64-bionic/dwd-backend release/dwd-backend-linux-x86_64-bionic

          # Debian packages.
          for codename in noble jammy bionic; do
            for package in artifacts/dwd-debian-package-"$codename"/*.deb \
                artifacts/dwd-backend-debian-package-"$codename"/*.deb; do
              package_name=$(basename "$package" .deb)
              cp "$package" "release/${package_name}-${codename}.deb"
            done
          done
          
          # Create checksums.
          cd release
          sha256sum -- * > SHA256SUMS
          
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release-tag }}
          name: Release ${{ needs.metadata.outputs.release-tag }}
          draft: false
          prerelease: false
          generate_release_notes: ${{ github.event_name != 'workflow_dispatch' }}
          files: |
            release/*
