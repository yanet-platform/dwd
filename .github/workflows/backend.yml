name: Backend Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      release-tag:
        description: Release tag used for Debian package versions
        type: string
        default: ''

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Backend (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ubuntu: '24.04'
            suffix: ''
          - ubuntu: '18.04'
            suffix: '-compat'
    steps:
      - uses: actions/checkout@v4

      - name: Set release version from tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          release_version="${RELEASE_TAG#v}"
          echo "DWD_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dwd-backend
          file: dwd-backend/Dockerfile
          push: false
          tags: dwd-backend:build${{ matrix.suffix }}
          build-args: |
            UBUNTU_VERSION=${{ matrix.ubuntu }}
            DWD_VERSION=${{ env.DWD_VERSION }}
          load: true
          cache-from: type=gha,scope=backend-ubuntu${{ matrix.ubuntu }}
          cache-to: type=gha,mode=max,scope=backend-ubuntu${{ matrix.ubuntu }}

      - name: Extract backend artifacts from Docker image
        env:
          IMAGE: dwd-backend:build${{ matrix.suffix }}
        run: |
          container_id=$(docker create "$IMAGE")
          mkdir -p dist
          docker cp "$container_id:/src/target/x86_64-unknown-linux-gnu/release/dwd-backend" dist/dwd-backend
          docker cp "$container_id:/src/target/debian/." dist/
          docker rm "$container_id"

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: dwd-backend-linux-x86_64${{ matrix.suffix }}
          path: dist/dwd-backend
          if-no-files-found: error

      - name: Upload backend Debian package
        uses: actions/upload-artifact@v4
        with:
          name: dwd-backend-debian-package${{ matrix.suffix }}
          path: dist/*.deb
          if-no-files-found: error
