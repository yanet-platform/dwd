name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Cancel previous runs when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks - run in parallel for quick feedback.
  format:
    name: Format (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: dwd
            directory: .
          - project: dwd-backend
            directory: dwd-backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: ${{ matrix.directory }}
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: dwd
            directory: .
            features: ''
          - project: dwd-backend
            directory: dwd-backend
            features: jemalloc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.project }}
          workspaces: ${{ matrix.directory }} -> target
      - name: Run clippy
        working-directory: ${{ matrix.directory }}
        run: cargo clippy --workspace --all-targets --locked --features "${{ matrix.features }}" -- -D warnings

  check:
    name: Check (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: dwd
            directory: .
            features: ''
          - project: dwd-backend
            directory: dwd-backend
            features: jemalloc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.project }}
          workspaces: ${{ matrix.directory }} -> target
      - name: Run cargo check
        working-directory: ${{ matrix.directory }}
        run: cargo check --workspace --all-targets --locked --features "${{ matrix.features }}"

  # MSRV check.
  msrv:
    name: MSRV 1.96 (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: dwd
            directory: .
            features: ''
          - project: dwd-backend
            directory: dwd-backend
            features: jemalloc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.project }}
          workspaces: ${{ matrix.directory }} -> target
      - name: Check MSRV
        working-directory: ${{ matrix.directory }}
        run: cargo check --workspace --locked --features "${{ matrix.features }}"

  # Tests - run after format/clippy/check pass.
  test:
    name: Test (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [format, clippy, check]
    strategy:
      matrix:
        include:
          - project: dwd
            directory: .
            features: ''
          - project: dwd-backend
            directory: dwd-backend
            features: jemalloc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.project }}
          workspaces: ${{ matrix.directory }} -> target
      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: cargo test --workspace --all-targets --locked --features "${{ matrix.features }}"

  # Build without DPDK - for platforms where DPDK is not available.
  build:
    name: Build (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: [format, clippy, check]
    strategy:
      matrix:
        include:
          - project: dwd
            directory: .
            features: ''
          - project: dwd-backend
            directory: dwd-backend
            features: jemalloc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.project }}
          workspaces: ${{ matrix.directory }} -> target
      - name: Build release
        working-directory: ${{ matrix.directory }}
        run: cargo build --workspace --release --locked --features "${{ matrix.features }}"
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-linux-x86_64
          path: ${{ matrix.directory }}/target/release/${{ matrix.project }}
          if-no-files-found: error
